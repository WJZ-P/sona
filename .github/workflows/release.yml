name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: |
          # CI 环境：将 loaderPath 指向当前目录，让构建产物输出到项目内
          node -e "
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            pkg.config.loaderPath = './';
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npx tsc
          npx vite build

      - name: Prepare release package
        run: |
          mkdir -p release/sona
          # 复制构建产物（index.js = 壳 + 内置本体，样式已内嵌，不再有 index.css）
          cp dist/index.js release/sona/
          # 复制 assets（如果存在）
          if [ -d "dist/assets" ]; then
            cp -r dist/assets release/sona/
          fi
          # 预留用户自定义资源目录，用户可把头像、背景等图片放到这里
          mkdir -p release/sona/assets
          cat > release/sona/assets/README.txt <<'EOF'
          中文：
          这里是 Sona 的自定义资源目录。
          你可以把头像、背景、图标等图片放在这个 assets 文件夹里。

          English:
          This is Sona's custom assets folder.
          You can put custom avatars, backgrounds, icons, and other images in this assets folder.
          EOF
          # 打包
          cd release
          zip -r ../sona-${{ github.ref_name }}.zip sona/

      - name: Generate release notes
        id: notes
        run: |
          TAG=${{ github.ref_name }}
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          # 尝试从 CHANGELOG.md 提取当前版本的内容
          if [ -f CHANGELOG.md ]; then
            # 提取两个版本标题之间的内容
            NOTES=$(sed -n "/^## \[${TAG#v}\]/,/^## \[/{ /^## \[${TAG#v}\]/d; /^## \[/d; p; }" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              # 如果没有匹配到，提取第一个版本块
              NOTES=$(sed -n '/^## \[/,/^## \[/{//!p;}' CHANGELOG.md | head -50)
            fi
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          # 写入多行输出
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check hot-update files
        run: |
          # 热更新依赖仓库里随 tag 提交的 core.js 与 core-manifest.json，这里只做一致性提醒。
          git show "${GITHUB_SHA}:core-manifest.json" > committed-manifest.json 2>/dev/null || echo '{}' > committed-manifest.json
          git show "${GITHUB_SHA}:core.js" > committed-core.js 2>/dev/null || : > committed-core.js
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const manifest = JSON.parse(fs.readFileSync('committed-manifest.json', 'utf8'));
            const sha = crypto.createHash('sha256').update(fs.readFileSync('committed-core.js')).digest('hex');
            const problems = [];
            if (manifest.version !== process.env.TAG_VERSION.replace(/^v/, '')) problems.push('core-manifest.json 版本 ' + manifest.version + ' 与 tag ' + process.env.TAG_VERSION.replace(/^v/, '') + ' 不一致');
            if (manifest.sha256 !== sha) problems.push('core.js 与 core-manifest.json 的 sha256 不一致');
            if (problems.length) problems.forEach((p) => console.log('::warning::热更新文件未同步：' + p + '（请先本地 npm run build 再提交打 tag）'));
            else console.log('热更新文件一致 ✓');
          "
        env:
          TAG_VERSION: ${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sona ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          files: sona-${{ github.ref_name }}.zip
          draft: false
          prerelease: false

      # 热更新：清单在 main 上随版本提交，发布后刷新 jsDelivr 缓存，并预热本版本的 core.js。
      - name: Purge jsDelivr hot-update manifest
        run: |
          curl -fsS --retry 3 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/core-manifest.json" \
            || echo "::warning::jsDelivr purge 失败，清单最多 12 小时后自动过期"
          curl -fsS -o /dev/null --retry 3 "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/core.js" \
            || echo "::warning::core.js 预热失败，不影响客户端下载"
